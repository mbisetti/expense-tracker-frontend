<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover: instalada en un iPhone con notch, el fondo llega hasta los
         bordes y el layout compensa con env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Default del tema claro; en runtime useTheme la sincroniza con el --bg activo. -->
    <meta name="theme-color" content="#fafaf9" />
    <title>Maat</title>
    <meta
      name="description"
      content="Maat: gastos, presupuestos, ingresos y transferencias multi-moneda en un solo lugar. Tus finanzas en orden."
    />
    <meta property="og:title" content="Maat" />
    <meta
      property="og:description"
      content="Gastos, presupuestos, ingresos y transferencias multi-moneda en un solo lugar. Tus datos son tuyos, sin venta de datos."
    />
    <meta property="og:type" content="website" />

    <!-- PWA en iOS (S35): Safari ignora el manifest, así que la instalación desde
         "Agregar a la pantalla de inicio" se configura acá. El ícono es opaco a
         propósito: iOS pinta de negro cualquier transparencia. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Maat" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
